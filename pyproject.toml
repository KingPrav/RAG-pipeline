[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production-grade RAG pipeline: hybrid retrieval + cross-encoder reranking + RAGAS eval"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "rich>=13.8.0",
    "tiktoken>=0.7.0",
    "gitpython>=3.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.0",
    "datasets>=2.20.0",
]
tracing = [
    "arize-phoenix>=4.0.0",
    "openinference-instrumentation-anthropic>=0.1.0",
]
all = ["rag-pipeline[eval,tracing]"]

[tool.hatch.build.targets.wheel]
packages = ["src", "api", "app", "scripts"]
